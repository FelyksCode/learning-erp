[project]
name = "learning-erp-backend"
version = "0.1.0"
description = "Inventory ERP backend (FastAPI + SQLAlchemy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "FURB157"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure logic, no HTTP layer",
    "api: exercises endpoints through TestClient",
    "integration: multi-step business flows",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
